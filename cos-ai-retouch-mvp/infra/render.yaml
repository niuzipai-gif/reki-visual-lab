services:
  - type: web
    name: cos-ai-retouch-mvp-api
    runtime: python
    plan: free
    rootDir: cos-ai-retouch-mvp/backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Enter runtime values in the Render Dashboard. These are intentionally
      # not committed to the Blueprint and are not local-disk storage settings.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Open by default; set this to true and configure INVITE_TOKENS for strict validation.
      - key: REQUIRE_INVITE_TOKENS
        value: "false"
      - key: INVITE_TOKENS
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_SIGNING_SECRET
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: RUNTIME_ENVIRONMENT
        value: production
      - key: IMAGE_PROVIDER_MODE
        value: minimax
      - key: IMAGE_PROVIDER_BASE_URL
        sync: false
      - key: IMAGE_PROVIDER_MODEL
        value: image-01
      - key: IMAGE_PROVIDER_API_KEY
        sync: false
