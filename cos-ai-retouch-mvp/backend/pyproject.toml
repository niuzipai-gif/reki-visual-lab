[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cos-ai-retouch-backend"
version = "0.1.0"
description = "Backend service for the invite-only COS AI retouch MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "Pillow>=11,<12",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
