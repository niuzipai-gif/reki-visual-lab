[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cos-ai-retouch-backend"
version = "0.1.0"
description = "Backend service for the invite-only COS AI retouch MVP"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "boto3==1.42.89",
    "fastapi==0.140.7",
    "Pillow==11.3.0",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.14.1",
    "SQLAlchemy==2.0.49",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
