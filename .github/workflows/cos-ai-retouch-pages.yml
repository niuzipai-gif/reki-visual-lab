name: Deploy COS AI Retouch Pages

on:
  push:
    branches:
      - main
    paths:
      - "cos-ai-retouch-mvp/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: cos-ai-retouch-mvp/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cos-ai-retouch-mvp/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL
        shell: bash
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::VITE_API_BASE_URL must be configured as a repository Actions variable."
            exit 1
          fi
        env:
          # Repository Actions variable; this is intentionally not a secret.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Build frontend
        run: npm run build
        env:
          # Repository Actions variable; this is intentionally not a secret.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cos-ai-retouch-mvp/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
